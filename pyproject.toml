[project]
name = "waves"
authors = [{ name = "iamprivacy" }]
# Kept equal to waves.waves_ui.__version__, which is the version the app and
# the updater actually report; tests/packaging/test_package_version.py fails the build if
# the two drift. Bump both in the same commit that cuts a release.
version = "0.1.30"
description = "Waves: a native desktop app for saving music from your own TIDAL account for offline listening"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12,<3.15"

dependencies = [
  "requests>=2.34.2,<3",
  "mutagen>=1.47.0,<2",
  "dataclasses-json>=0.6.7,<0.7",
  "pathvalidate>=3.3.1,<4",
  "m3u8>=6.0.0,<7",
  "gamdl>=3.8.5,<3.9",
  "tidalapi>=0.8.10,<0.9",
  "python-ffmpeg>=2.0.12,<3",
  # Direct import in waves/providers/apple/engine.py (the cookies-tier fallback shells
  # through it); pinned to gamdl's own floor so the two can never disagree.
  "yt-dlp>=2025.10.22",
  "pycryptodome>=3.23.0,<4",
  "certifi>=2026.4.22",
  "urllib3>=2.7.0,<3",
]

[project.urls]
homepage = "https://getwaves.dev"
repository = "https://github.com/iamprivacy/Waves"
documentation = "https://getwaves.dev"

[project.optional-dependencies]
# Exact pin. PySide6 6.10.0 through 6.11.1 ship macOS binding libraries built
# for macOS 15 despite their macosx_13_0 wheel tag, so on macOS this version
# really requires Sequoia (dyld kills the app on anything older, issue #14).
# The release handles that with two macOS flavors: the regular build uses this
# pin (floor 15.0), and CI's legacy macOS legs overlay pyside6==6.9.3 (the
# newest release whose binaries honor their macOS 12 wheel tag) on top of the
# locked venv for a "_legacy" bundle with floor 12.0 (see WAVES_MACOS_MIN in
# mise.toml and the legacy legs in release-or-test-build.yml). CI's "Assert
# macOS version floor" step enforces each flavor's floor on every macOS build;
# when a PySide6 release honors its wheel tags again the legacy legs can go.
gui = ["pyside6==6.11.1"]

[dependency-groups]
dev = [
  "pytest>=9.0.1,<10",
  "deptry>=0.25.1,<0.26",
  "pre-commit>=4.5.0,<5",
  "pyupgrade>=3.21.2,<4",
  "pillow>=12.0.0,<13",
  "black>=26.5.1,<27",
  # Exact pin: the release build cache is keyed to Nuitka's generated C, and a
  # bump invalidates it (docs/dependency-updates.md).
  "nuitka==2.8.4",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "qml: drives the real QML tree offscreen (needs PySide6; skipped without it)",
  "ffmpeg: uses a real ffmpeg/ffprobe binary (skipped when none is on PATH)",
  "integration: crosses a real process, disk store or service boundary (opt-in groups)",
  "platform: behavior that depends on the host platform",
  "slow: the long tail of the qml group: one of the heaviest boots (8 s or more), always marked beside qml",
  "account: runs against the real Apple/TIDAL accounts (opt-in via WAVES_ACCOUNT_TESTS=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
# Overview: https://docs.astral.sh/ruff/rules/
select = [
  # flake8-2020
  "YTT",
  # flake8-bandit
  "S",
  # flake8-bugbear
  "B",
  # flake8-builtins
  "A",
  # flake8-comprehensions
  "C4",
  # flake8-debugger
  "T10",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  "W",
  # pyflakes
  "F",
  # pygrep-hooks
  "PGH",
  # pyupgrade
  "UP",
  # ruff
  "RUF",
  # tryceratops
  "TRY",
]
ignore = [
  # LineTooLong
  "E501",
  # DoNotAssignLambda
  "E731",
  # Do not use bare `except`
  "E722",
  # PEP 484 prohibits implicit `Optional`
  # Disabled only temporarily.
  "RUF013",
  # Ambiguous-unicode warnings: the UI deliberately uses real typography
  # (en dash "–", multiplication sign "×", etc.) in user-facing strings,
  # docstrings and comments.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.per-file-ignores]
# Tests use asserts (S101), terse error messages (TRY003) and throwaway temp
# paths like "/tmp/x" as never-touched dummy dirs (S108).
"tests/*" = ["S101", "TRY003", "S108"]
# One deliberately linear end-to-end journey (pick a provider -> Settings ->
# sign in -> sign out -> relaunch); the branching is the journey (C901).
"tests/ui/test_account_journey.py" = ["C901"]
# The boot scenarios replay one launch sequence start to finish; the
# branching is the sequence (C901).
"tests/ui/test_boot_fade_landing_park.py" = ["C901"]
"tests/ui/test_boot_shield_cursor_release.py" = ["C901"]
"tests/ui/test_boot_version_drain_order.py" = ["C901"]
# The ported browse scenarios keep their boot -> drive -> assert shape as one
# deliberately linear function (C901).
"tests/ui/test_browse_back_scroll.py" = ["C901"]
"tests/ui/test_browse_card_library_state.py" = ["C901"]
"tests/ui/test_browse_card_line_fits.py" = ["C901"]
"tests/ui/test_browse_console_wayfinding.py" = ["C901"]
"tests/ui/test_browse_row_window.py" = ["C901"]
"tests/ui/test_browse_strip_fits_the_card.py" = ["C901"]
# The ported search scenarios keep their boot -> drive -> assert shape as one
# deliberately linear function (C901).
"tests/ui/test_search_artists_show_all_empty.py" = ["C901"]
"tests/ui/test_search_playlist_block.py" = ["C901"]
"tests/ui/test_search_refresh_in_place.py" = ["C901"]
"tests/ui/test_search_scroll_reset.py" = ["C901"]
"tests/ui/test_search_tab_artist_restore.py" = ["C901"]
"tests/ui/test_search_top_result.py" = ["C901"]
# The ported queue/progress scenarios keep their boot -> drive -> assert shape
# as one deliberately linear function (C901).
"tests/ui/test_card_progress_outline.py" = ["C901"]
"tests/ui/test_progress_carved_percent.py" = ["C901"]
"tests/ui/test_progress_jump_ramp.py" = ["C901"]
"tests/ui/test_progress_matrix_stable_width.py" = ["C901"]
"tests/ui/test_progress_pad_cells.py" = ["C901"]
"tests/ui/test_queue_drawer_close_button.py" = ["C901"]
"tests/ui/test_queue_drawer_resize.py" = ["C901"]
"tests/ui/test_queue_expected_tier.py" = ["C901"]
"tests/ui/test_queue_failed_section.py" = ["C901"]
"tests/ui/test_queue_ledger_cap.py" = ["C901"]
"tests/ui/test_queue_owned_prediction.py" = ["C901"]
"tests/ui/test_queue_playlist_expands.py" = ["C901"]
"tests/ui/test_queue_repeated_track_state.py" = ["C901"]
"tests/ui/test_queue_row_index.py" = ["C901"]
"tests/ui/test_queue_row_progress_density.py" = ["C901"]
"tests/ui/test_queue_row_quality.py" = ["C901"]
"tests/ui/test_queue_unavailable_word.py" = ["C901"]
# The ported hover/video scenarios keep their boot -> drive -> assert shape as
# one deliberately linear function (C901).
"tests/ui/test_hover_prefetch_scenario.py" = ["C901"]
"tests/ui/test_hover_swell_fade.py" = ["C901"]
"tests/ui/test_video_grid_hover_dwell.py" = ["C901"]
# The ported update-toast scenario keeps its boot -> drive -> assert shape as
# one deliberately linear function (C901).
"tests/ui/test_update_toast_staged.py" = ["C901"]
# The ported folder/playlist/nav scenarios keep their boot -> drive -> assert
# shape as one deliberately linear function (C901).
"tests/ui/test_folder_badge_and_crumb_labels.py" = ["C901"]
"tests/ui/test_forward_history_account_switch.py" = ["C901"]
"tests/ui/test_playlist_folder_qml.py" = ["C901"]
"tests/ui/test_playlist_selection_and_reset.py" = ["C901"]
# The ported library scenarios keep their boot -> drive -> assert shape as one
# deliberately linear function (C901).
"tests/ui/test_library_downloaded_state.py" = ["C901"]
"tests/ui/test_library_presence_surfaces.py" = ["C901"]
"tests/ui/test_library_track_claim.py" = ["C901"]
"tests/ui/test_presence_call_budget.py" = ["C901"]
# Sets a real xattr via the fixed /usr/bin/xattr binary to exercise the strip
# helper for real on macOS (S603, fixed argv).
"tests/metadata/test_apple_double_cleanup.py" = ["S603"]
# Measures import-time metadata cost in a fresh interpreter: this interpreter
# runs a literal probe script (S603, fixed argv).
"tests/ui/test_lazy_metadata.py" = ["S603"]
# The exit-time cancel of the freeze-watchdog countdown can only be observed
# in a fresh interpreter: this one runs a literal probe script (S603, fixed argv).
"tests/ui/test_freeze_watchdog_quit.py" = ["S603"]
# The library scanner's directory walk (_walk_album_dirs) is a small state
# machine over each folder's probe result (unchanged / relist / transient error /
# vanished / root offline); the branching is the point and the function was kept
# whole so it reads (and was reviewed) as one flow, so exempt mccabe (C901).
"waves/library_index.py" = ["C901"]
# Same subprocess-isolation + linear-scenario shape as the scroll guard.
"tests/ui/test_gates_sit_above_drawers.py" = ["S603", "C901"]
"tests/ui/test_qml_loads.py" = ["S603", "C901"]
# The launch probe runs a fixed-argv subprocess the same way (S603).
"tools/launch_probe.py" = ["S603"]
# The ported launch/search/queue scenarios keep their boot -> drive -> assert
# child as one deliberately linear function (C901); the subprocess call
# itself lives in support.qml's runner.
"tests/ui/test_boot_quiet_window.py" = ["C901"]
"tests/ui/test_new_release_mark.py" = ["C901"]
"tests/ui/test_queue_section_pulse.py" = ["C901"]
"tests/ui/test_queue_single_row_has_nothing_to_expand.py" = ["C901"]
"tests/ui/test_search_query_collapse_qml.py" = ["C901"]
# The provider-logo scenario is the same boot -> drive -> assert shape: one
# deliberately linear function (C901).
"tests/providers/test_provider_logos.py" = ["C901"]
# The live account suite probes a downloaded file with a fixed-argv ffprobe.
"tests/account/test_live_account.py" = ["S603"]
# The scenario files added for the T6 pass and the remaining item-21
# additions keep the same shape: boot the real Main.qml, drive one flow and
# assert on the rendered tree, as one deliberately linear function (C901).
# The subprocess call itself lives in support.qml's runner.
"tests/providers/apple/test_apple_setup_guidance.py" = ["C901"]
"tests/providers/apple/test_apple_probe_responsive.py" = ["C901"]
"tests/ui/test_dual_version_queue_scenario.py" = ["C901"]
"tests/ui/test_track_row_hover_stable.py" = ["C901"]
# Imports the download engine in a clean interpreter to check its import closure
# (S603, fixed argv: sys.executable -c with a literal probe).
"tests/library/test_library_bridge.py" = ["S603"]
# The startup picker scenario re-runs itself in a subprocess to isolate the
# Qt boot (S603, fixed argv).
"tests/ui/test_startup_provider_picker_qml.py" = ["S603"]
# The TIDAL sign-in reachability scenario re-runs itself in a subprocess to
# isolate the Qt boot (S603, fixed argv), and its build -> click -> assert
# scenario is one deliberately linear function (C901).
"tests/ui/test_tidal_signin_reachable_qml.py" = ["S603", "C901"]
# The setup-CTA scenarios keep the same boot -> drive -> assert shape as one
# deliberately linear function (C901); the subprocess call itself lives in
# support.qml's runner.
"tests/ui/test_setup_ctas_qml.py" = ["C901"]
"tests/ui/test_offscreen_qt_is_usable.py" = ["S603"]
# Runs the bundle size report for real, on a root wide enough to fill the pipe
# buffer, through the shell it is written for (S603/S607, fixed argv).
"tests/packaging/test_final_audit_updater.py" = ["S603", "S607"]
# Drives the real release.sh (bash) and git against throwaway sandbox repos;
# both are resolved from PATH on purpose (S603/S607, fixed argv).
"tests/packaging/test_release_star_history.py" = ["S603", "S607"]
# The Waves bridge has several inherently branchy but linear functions (the
# settings-schema builder, the settings dispatcher and the search/discography
# orchestration) that trip mccabe (C901) without being genuinely complex.
"waves/waves_ui/backend.py" = ["C901"]
# The ffmpeg manager's job is to download and run a static ffmpeg build, so it
# intentionally shells out (S603/S607); install() is one linear sequence (C901);
# and its raised errors carry deliberately descriptive messages (TRY003).
"waves/waves_ui/ffmpeg_manager.py" = ["S603", "S607", "C901", "TRY003"]
# Same shape for the managed Apple runtime (issue #31): it downloads and runs
# the N_m3u8DL-RE binary and probes the container runtime (S603/S607), its
# install is one linear sequence (C901), and its errors carry deliberately
# descriptive messages (TRY003).
"waves/providers/apple/runtime.py" = ["S603", "S607", "C901", "TRY003"]
# Session supervision (issue #33): it starts/stops the wrapper sidecar via the
# container runtime and probes its health endpoint (S603/S607), and its
# helpers carry deliberately descriptive messages (TRY003).
"waves/providers/apple/supervision.py" = ["S603", "S607", "TRY003"]
# The Apple job runner owns the orchestration the bridge used to hold: the
# per-track delivery and the job settlement are deliberately linear sequences
# (C901), and their raised messages are the queue row's own user-facing words
# (TRY003), same rationale as the bridge itself.
"waves/providers/apple/runner.py" = ["C901", "TRY003"]
# The updater downloads and swaps a packaged build, so it intentionally shells
# out (S603/S607) for the platform swap/relaunch; install()/_apply are linear
# sequences (C901); and its errors carry deliberately descriptive messages (TRY003).
"waves/waves_ui/updater.py" = ["S603", "S606", "S607", "C901", "TRY003"]
# download.py is upstream Tidaler code (kept as-is apart from the keep_album flag);
# its downsample/transcode raises carry deliberately descriptive messages (TRY003),
# same rationale as ffmpeg_manager/updater above.
"waves/download.py" = ["TRY003"]
# The untrusted-listing recovery mounts a share a second time to read the names
# the first mount will not list, so it intentionally shells out to the system's
# own mount and umount binaries (S603, fixed argv, no shell).
"waves/waves_ui/smb_relist.py" = ["S603"]

[tool.black]
# https://github.com/psf/black
# The target versions are the syntax FLOOR, not the support matrix: code must
# parse on 3.12, so the formatter must not emit 3.13+/3.14-only syntax. Black 26
# also warns and skips its AST safety check when a target is newer than the
# interpreter running it (CI and the pre-commit hook run 3.13), so targeting
# 3.14 would buy nothing and cost the check.
target-version = ["py312", "py313"]
line-length = 120
color = true
preview = true

exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | env
    | venv
)/
'''
