name: master

# Manual only. This workflow lives on the private development repo, where
# Actions minutes are metered, and the suite already runs on the developer's
# machine before every commit. Run it from the Actions tab when a second
# opinion from a Linux runner is wanted; a push never starts it.
on:
  workflow_dispatch:

# These jobs only read the repo (lint, test); grant the token no more than
# read access. Raise per-job if a job ever needs to write.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-env

      - name: Run checks
        run: mise run check

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      # Offscreen Qt still links libEGL and friends, and ubuntu-24.04 ships
      # without them; every test module that imports PySide6 failed at
      # collection here. The release build installs the same set.
      - name: Install the Qt runtime libraries the offscreen tests load
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libpulse0 libasound2t64

      - name: Test (strict group)
        run: mise run test-strict
