# Publishing the Waves wrapper image (issue #76).
#
# Upstream wrapper-v2 ships source only, so Waves publishes its own pinned
# image for end-user pulls. The build needs Apple's native libraries, which
# must never enter this repo: they arrive at build time through the private
# APK_URL secret (an .apk/.apkm you host privately). The lib pins are
# regenerated deterministically from that blessed APK (issue #82) instead
# of trusting upstream's pin file to track it, then strictly verified; the
# blessed APK identity (version/build inputs) is recorded, not trusted
# blindly.
# The secrets are unreadable from forks, so fork PRs can read this file
# but never run the publish path. Private hosting needs auth: set the
# optional APK_AUTH_HEADER secret to the full header line (e.g.
# "Authorization: Bearer <token>"); it is sent only to fetch the artifact
# and never printed (secret values are masked in logs).
#
# What gets published: linux/arm64 only (the Apple-silicon native path; the
# compile stage stays linux/amd64 because Google ships the NDK as x86_64
# only). The pushed tag must equal the pin in waves/apple_runtime.py
# (WRAPPER_V2_IMAGE); the pin-drift test fails the suite otherwise.
name: wrapper-image

on:
  workflow_dispatch:
    inputs:
      wrapper_ref:
        description: "Upstream wrapper-v2 ref to build (branch, tag, or SHA; prefer a SHA)"
        required: false
        default: "main"
        type: string
      image_tag:
        description: "Tag to push (must equal the WRAPPER_V2_IMAGE pin)"
        required: false
        default: "0.2.3"
        type: string
      apk_version:
        description: "Blessed APK version (must equal APK_PINNED_VERSION)"
        required: false
        default: "3.6.0-beta"
        type: string
      apk_build:
        description: "Blessed APK build number (lib pins are generated from it)"
        required: false
        default: "1109"
        type: string

permissions:
  contents: read
  packages: write

# Publishes must never overlap: two pushes of one tag is a race.
concurrency:
  group: wrapper-image-publish
  cancel-in-progress: false

jobs:
  build:
    name: build and publish (linux/arm64)
    runs-on: ubuntu-latest
    env:
      APK_URL: ${{ secrets.APK_URL }}
      APK_AUTH_HEADER: ${{ secrets.APK_AUTH_HEADER }}
      # Your own namespace by default, so forks publish under their own name
      # with zero edits (the app pin stays the maintainer's; see docs).
      IMAGE: ghcr.io/${{ github.repository_owner }}/waves-wrapper-v2
      TAG: ${{ inputs.image_tag }}
      APK_VERSION: ${{ inputs.apk_version }}
      APK_BUILD: ${{ inputs.apk_build }}
      TARGET_ARCH: arm64-v8a
      RUNTIME_PLATFORM: linux/arm64

    steps:
      - name: Check out upstream wrapper-v2 at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: glomatico/wrapper-v2
          ref: ${{ inputs.wrapper_ref }}
          path: wrapper-v2

      - name: Record the exact source SHA
        working-directory: wrapper-v2
        run: |
          echo "WRAPPER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD

      # The arm64 image runs under QEMU on amd64 runners (smoke test only;
      # the compile stage stays amd64 for the x86_64-only NDK).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq unzip curl ca-certificates

      - name: Validate Compose config
        working-directory: wrapper-v2
        run: docker compose config --quiet

      - name: Rust unit tests
        working-directory: wrapper-v2
        run: cargo test

      - name: Make scripts executable
        working-directory: wrapper-v2
        run: chmod +x tools/extract-libs.sh tools/stage-system.sh

      - name: Sanity check APK_URL secret
        run: |
          if [[ -z "${APK_URL}" ]]; then
            echo "::error::APK_URL secret is not set."
            echo "Maintainers: add a repository secret APK_URL pointing at a privately hosted"
            echo "Apple Music .apk/.apkm (see docs/wrapper-image.md). It is never committed."
            exit 1
          fi

      - name: Download Apple Music artifact
        run: |
          mkdir -p .tmp
          artifact=".tmp/apple-music.apk"
          if [[ "${APK_URL,,}" == *.apkm* ]]; then
            artifact=".tmp/apple-music.apkm"
          fi
          # Private hosting (a private-repo release asset, a token-gated
          # bucket) authenticates through APK_AUTH_HEADER; the header value
          # is a masked secret and never appears in logs.
          auth_args=()
          if [[ -n "${APK_AUTH_HEADER}" ]]; then
            auth_args=(-H "${APK_AUTH_HEADER}")
          fi
          curl -fL --retry 3 --retry-delay 2 "${auth_args[@]}" -o "${artifact}" "${APK_URL}"
          echo "APPLE_MUSIC_ARTIFACT=${artifact}" >> "$GITHUB_ENV"
          ls -lh "${artifact}"

      - name: Regenerate lib pins from the blessed APK
        working-directory: wrapper-v2
        run: |
          # Upstream's LIBS_VERSION.json is not guaranteed to track the
          # blessed APK (issue #82), so the blessed file is the source of
          # truth: extract once ignoring hashes, rewrite this arch's pins
          # plus the APK identity, and let the strict extraction below prove
          # the tree matches. The APK file itself is authenticated by the
          # app's APK_SHA256 on the user side, never here.
          blessed_out="${RUNNER_TEMP}/blessed-libs"
          ./tools/extract-libs.sh \
            --bundle "${GITHUB_WORKSPACE}/${APPLE_MUSIC_ARTIFACT}" \
            --arch "${TARGET_ARCH}" \
            --out "${blessed_out}" \
            --ignore-hash
          python3 - "${blessed_out}" "${APK_VERSION}" "${APK_BUILD}" <<'EOF'
          import hashlib
          import json
          import sys
          from pathlib import Path

          out_dir, apk_version, apk_build = sys.argv[1], sys.argv[2], sys.argv[3]
          libs = {}
          for f in sorted(Path(out_dir).glob("*.so")):
              libs[f.name] = hashlib.sha256(f.read_bytes()).hexdigest()
          pins = Path("LIBS_VERSION.json")
          data = json.loads(pins.read_text())
          data["libs"]["arm64-v8a"] = libs
          data["apple_music"]["version"] = apk_version
          data["apple_music"]["build"] = apk_build
          pins.write_text(json.dumps(data, indent=2) + "\n")
          print(f"pinned {len(libs)} arm64-v8a libs from APK {apk_version} build {apk_build}")
          EOF

      - name: Extract Apple native libs, strict against regenerated pins
        working-directory: wrapper-v2
        run: |
          ./tools/extract-libs.sh \
            --bundle "${GITHUB_WORKSPACE}/${APPLE_MUSIC_ARTIFACT}" \
            --arch "${TARGET_ARCH}"

      - name: Stage Android system binaries
        working-directory: wrapper-v2
        run: ./tools/stage-system.sh --arch "${TARGET_ARCH}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: wrapper-v2
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            BUILD_PLATFORM=linux/amd64
            RUNTIME_PLATFORM=${{ env.RUNTIME_PLATFORM }}
            TARGET_ARCH=${{ env.TARGET_ARCH }}

      - name: Smoke test (HTTP and TCP)
        run: |
          docker rm -f wrapper-smoke 2>/dev/null || true
          # Same caps as production (see apple_supervision.container_run_args):
          # AppArmor's default profile can deny mount(2) even with CAP_SYS_ADMIN.
          docker run -d \
            --platform "${RUNTIME_PLATFORM}" \
            --name wrapper-smoke \
            --cap-add SYS_ADMIN --cap-add SYS_CHROOT --cap-add SYS_PTRACE \
            --security-opt apparmor=unconfined \
            -p 8080:80 \
            -p 11020:10020 \
            "${IMAGE}:${TAG}"
          http_ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "health OK after ${i} attempt(s)"
              http_ok=1
              break
            fi
            sleep 2
          done
          if [[ "$http_ok" != "1" ]]; then
            echo "::error::health did not become ready in time"
            docker logs wrapper-smoke 2>&1 || true
            docker rm -f wrapper-smoke 2>/dev/null || true
            exit 1
          fi
          curl -sf http://127.0.0.1:8080/health | jq .
          tcp_ok=0
          for i in $(seq 1 20); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/11020' 2>/dev/null; then
              echo "TCP decrypt listener OK after ${i} attempt(s)"
              tcp_ok=1
              break
            fi
            sleep 2
          done
          if [[ "$tcp_ok" != "1" ]]; then
            echo "::error::TCP decrypt listener did not accept connections in time"
            docker logs wrapper-smoke 2>&1 || true
            docker rm -f wrapper-smoke 2>/dev/null || true
            exit 1
          fi
          docker rm -f wrapper-smoke

      - name: Publish summary
        run: |
          {
            echo "## Wrapper image published"
            echo ""
            echo "| Fact | Value |"
            echo "| ---- | ----- |"
            echo "| Image | \`${IMAGE}:${TAG}\` |"
            echo "| Upstream ref | \`${{ inputs.wrapper_ref }}\` (\`${WRAPPER_SHA}\`) |"
            echo "| Blessed APK | \`${APK_VERSION}\` build \`${APK_BUILD}\` (pins regenerated from it) |"
            echo "| Arch | \`${TARGET_ARCH}\` / \`${RUNTIME_PLATFORM}\` |"
            echo ""
            echo "Guest libs pinned by the source tree:"
            echo '```json'
            cat wrapper-v2/LIBS_VERSION.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
