# qmlformat style for this tree (tools/format_qml.sh and the qmlformat hook).
#
# Pinned explicitly so a Qt bump cannot silently restyle the tree. The
# non-default choices are deliberate: SemicolonRule=essential keeps the
# repo's semicolon-free JS (the default "always" adds one to every statement),
# NewlineType=unix keeps diffs stable across platforms, and NormalizeOrder /
# SortImports stay off so formatting never reorders code.
[General]
FunctionsSpacing=false
GroupAttributesTogether=false
IndentWidth=4
MaxColumnWidth=-1
NewlineType=unix
NormalizeOrder=false
ObjectsSpacing=false
SemicolonRule=essential
SingleLineEmptyObjects=false
SortImports=false
UseTabs=false
