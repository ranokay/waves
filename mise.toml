# Pinned tools and the development commands used locally and in CI.
#
# uv owns Python resolution, installation and the lockfile (uv.lock is the one
# authoritative lock; `uv lock --check` fails on drift); mise owns which
# Python and uv those are, and the tasks below are the commands DEVELOPER.md
# and CI both call. `mise run install` once after cloning, then any task.

[tools]
python = "3.13"
uv = "0.12.16"
hk = "2.5.0"
node = "22.23.3"
"npm:prettier" = "3.1.0"

[tasks.install]
description = "Create/sync the dev environment and install repository-local hk hooks"
run = "uv sync --locked --all-extras && uv run --locked --all-extras python tools/install_hooks.py"

[tasks.check]
alias = "lint"
description = "Read-only whole-tree lock, static analysis, formatting and dependency gate"
run = "hk check --all --check --no-stage --stash none"

[tasks.clean]
description = "Remove regenerable build and test caches (never .venv, never git clean; idempotent)"
run = "bash tools/clean.sh"

[tasks.lint-qml]
description = "qmllint the QML tree (errors fail; warnings are summarized)"
run = "bash tools/lint_qml.sh"

[tasks.format-qml]
description = "Format the QML tree with qmlformat (style pinned by .qmlformat.ini; pass files to format just those)"
run = "bash tools/format_qml.sh"

[tasks.fmt]
alias = "format"
description = "Explicitly apply Ruff, Prettier, QML and whitespace fixes without staging"
run = "hk fix --all --no-stage --stash none"

[tasks.typecheck]
description = "ty over the shipped package (waves/); errors fail and print, the baseline warnings are counted"
run = "bash tools/typecheck.sh"

[tasks.test-fast]
description = "Fast tests (excludes qml, ffmpeg, slow, integration and account markers)"
run = 'uv run --locked --all-extras pytest -rs -q -m "not qml and not ffmpeg and not slow and not account and not integration" tests'

[tasks.test-qml]
description = "The quick QML group (Qt required; < 5 min)"
run = 'uv run --locked --all-extras pytest -rs -q -m "qml and not slow and not integration and not account" --require-qml tests'

[tasks.test-default]
alias = "test"
description = "The default group (all but the live account tests; < 10 min)"
run = 'uv run --locked --all-extras pytest -rs -m "not account" tests'

[tasks.test-strict]
description = "The merge gate (everything but the live account tests; < 10 min)"
run = 'uv run --locked --all-extras pytest -rs --require-qml -m "not account" tests'

[tasks.test-ffmpeg]
description = "The ffmpeg group (assumes ffmpeg on PATH; < 1 min)"
run = 'uv run --locked --all-extras pytest -rs -q -m "ffmpeg and not account" tests'

[tasks.test-account]
description = "The live account group (needs credentials and WAVES_ACCOUNT_TESTS=1; never runs in CI)"
run = 'WAVES_ACCOUNT_TESTS=1 uv run --locked --all-extras pytest -q -m account tests'

[tasks.app]
description = "Run the Waves app from source"
run = "uv run --locked --all-extras python -m waves.desktop"

[tasks.build]
description = "Build the Waves QML app (Nuitka); on macOS this yields dist/waves.app"
run = "bash tools/build_waves.sh"

[tasks.doctor]
description = "Fail fast on stale installs and missing hooks (versions, waves/tidaler, lock, hooks, QML smoke)"
run = "bash tools/doctor.sh"

[tasks.frontier]
description = "Report each open wayfinder map's next agent-ready issue, live blockers and checklist drift (pass map numbers to narrow)"
run = "uv run --locked --all-extras python tools/wayfinder_frontier.py"

[tasks.graph]
description = "Refresh the code-review-graph index (run when list_graph_stats reports head_matches_build false; semantic search stays keyword until embeddings are generated)"
run = "uvx code-review-graph update"
