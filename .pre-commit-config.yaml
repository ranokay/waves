default_language_version:
  python: python3.12

default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # assets/star-history/ is a byte-for-byte copy of files generated on the
      # public repo (see tools/sync_star_history.sh). Reformatting it here would
      # make every sync show a diff that is only ours, so it is left alone.
      - id: end-of-file-fixer
        exclude: ^(LICENSE|assets/star-history/.*)$
      - id: trailing-whitespace
        exclude: ^assets/star-history/
      # Work reaches develop and main through PRs. The upstream sync merge is
      # the one direct write: a clean `git merge` skips this hook, and a
      # conflicted one concludes with SKIP=no-commit-to-branch (the
      # sync-upstream skill). `mise run check` skips it, since it commits nothing.
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main]
        stages: [pre-commit]

  # ruff runs from the project's own environment (the dev dependency is
  # pinned in pyproject.toml), not a separately-installed hook: one ruff
  # version lints locally, here and in CI, and --force-exclude keeps the
  # pyproject excludes honored when pre-commit passes explicit filenames.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --locked --all-extras ruff check --force-exclude
        types_or: [python, pyi]
        language: system
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --all-extras ruff format --force-exclude
        types_or: [python, pyi]
        language: system

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        # QML-dialect JS (".pragma library") is not parseable by prettier, and
        # the star-history charts are generated elsewhere (see above).
        exclude: ^(waves/desktop/qml/.*\.js|assets/star-history/.*)$

  - repo: local
    hooks:
      - id: qmlformat
        name: qmlformat
        entry: bash tools/format_qml.sh
        files: ^waves/desktop/qml/.*\.qml$
        language: system
      - id: qmllint
        name: qmllint
        entry: bash tools/lint_qml.sh
        files: ^waves/desktop/qml/.*\.(qml|js)$
        language: system

  - repo: local
    hooks:
      - id: pyupgrade
        name: pyupgrade
        entry: uv run pyupgrade --py312-plus
        types: [python]
        language: system
